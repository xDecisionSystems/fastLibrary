<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Venue — Paper Library</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;padding:24px}
  h1{font-size:1.4rem;margin-bottom:20px}
  .card{background:#fff;border-radius:8px;padding:24px;max-width:720px;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .row{display:flex;gap:12px;margin-bottom:14px}
  .row label{flex:0 0 160px;padding-top:6px;font-size:.875rem;color:#555}
  .row input,.row select,.row textarea{flex:1;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:.875rem}
  .row textarea{resize:vertical;min-height:60px}
  .prefill-bar{display:flex;gap:8px;margin-bottom:20px}
  .prefill-bar input{flex:1;padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:.9rem}
  .btn{padding:7px 16px;border:none;border-radius:4px;cursor:pointer;font-size:.875rem}
  .btn-primary{background:#0066cc;color:#fff}
  .btn-primary:hover{background:#0052a3}
  .btn-secondary{background:#e0e0e0;color:#333}
  .btn-secondary:hover{background:#c8c8c8}
  .btn-danger{background:#cc2222;color:#fff;padding:4px 10px;font-size:.8rem}
  .btn-danger:hover{background:#a01a1a}
  .section-title{font-size:.95rem;font-weight:600;margin:16px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{text-align:left;padding:4px 8px;background:#f0f0f0;border:1px solid #ddd}
  td{padding:4px 6px;border:1px solid #ddd}
  td input{width:100%;padding:3px 6px;border:1px solid #bbb;border-radius:3px;font-size:.83rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{background:#e8f0fe;border-radius:16px;padding:5px 12px;font-size:.8rem;display:flex;align-items:center;gap:6px}
  .chip a{color:#0052a3;text-decoration:none;font-size:.78rem}
  .chip a:hover{text-decoration:underline}
  #status{margin-top:12px;font-size:.85rem;color:green;min-height:20px}
  #status.err{color:#cc0000}
  .checkbox-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .checkbox-row label{font-size:.875rem;color:#555;flex:0 0 160px}
</style>
</head>
<body>
<div class="card">
  <h1>Add Venue</h1>

  <div class="prefill-bar">
    <input id="prefill-name" type="text" placeholder="Conference or journal name (e.g. ICRA, Nature Robotics)">
    <button class="btn btn-primary" onclick="doPrefill()">AI Prefill</button>
  </div>

  <div class="row"><label>Short name *</label><input id="f-short_name" type="text" placeholder="e.g. ICRA"></div>
  <div class="row"><label>Long name</label><input id="f-long_name" type="text" placeholder="e.g. International Conference on Robotics and Automation"></div>
  <div class="row">
    <label>Type</label>
    <select id="f-type">
      <option value="">— select —</option>
      <option value="conference">Conference</option>
      <option value="journal">Journal</option>
    </select>
  </div>
  <div class="row"><label>Publisher</label><input id="f-publisher" type="text" placeholder="e.g. IEEE"></div>
  <div class="row"><label>Main page URL</label><input id="f-access_url" type="url" placeholder="https://"></div>

  <div class="checkbox-row">
    <label>Open access</label>
    <input id="f-open_access" type="checkbox">
  </div>

  <div class="row"><label>Notes</label><textarea id="f-notes"></textarea></div>

  <div class="section-title">Download Sources</div>
  <table id="sources-table">
    <thead><tr><th>Name</th><th>URL</th><th>Notes</th><th></th></tr></thead>
    <tbody id="sources-body"></tbody>
  </table>
  <button class="btn btn-secondary" style="margin-top:8px" onclick="addSourceRow()">+ Add Source</button>

  <div style="margin-top:20px;display:flex;gap:10px">
    <button class="btn btn-primary" onclick="doSave()">Save Venue</button>
    <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
  </div>
  <div id="status"></div>

  <div id="chips-section" style="margin-top:24px;border-top:1px solid #eee;padding-top:16px;display:none">
    <div class="section-title">Saved Venues</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<script>
async function doPrefill(){
  const name=document.getElementById('prefill-name').value.trim();
  if(!name)return;
  setStatus('Prefilling…','');
  try{
    const r=await fetch('/api/venues/prefill?name='+encodeURIComponent(name));
    const d=await r.json();
    if(d.error){setStatus(d.detail||d.error,'err');return;}
    populate(d);
  }catch(e){setStatus('Request failed: '+e.message,'err');}
}

function populate(d){
  set('f-short_name',d.short_name||'');
  set('f-long_name',d.long_name||'');
  const typeSel=document.getElementById('f-type');
  typeSel.value=(d.type||'').toLowerCase();
  if(!typeSel.value)typeSel.value='';
  set('f-publisher',d.publisher||'');
  set('f-access_url',d.access_url||'');
  document.getElementById('f-open_access').checked=!!d.open_access;
  set('f-notes',d.notes||'');
  document.getElementById('sources-body').innerHTML='';
  (d.download_sources||[]).forEach(s=>addSourceRow(s.name,s.url,s.notes));
  setStatus('Prefilled — review and save.','');
}

function set(id,val){document.getElementById(id).value=val==null?'':val;}

function addSourceRow(name='',url='',notes=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input type="text" value="${esc(name)}" placeholder="e.g. IEEE Xplore"></td>
    <td><input type="url" value="${esc(url)}" placeholder="https://"></td>
    <td><input type="text" value="${esc(notes)}"></td>
    <td><button class="btn btn-danger" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('sources-body').appendChild(tr);
}

function esc(s){return String(s).replace(/"/g,'&quot;');}

function getForm(){
  const sources=[...document.querySelectorAll('#sources-body tr')].map(tr=>{
    const inputs=tr.querySelectorAll('input');
    return{name:inputs[0].value.trim(),url:inputs[1].value.trim(),notes:inputs[2].value.trim()};
  }).filter(s=>s.name||s.url);
  return{
    short_name:document.getElementById('f-short_name').value.trim(),
    long_name:document.getElementById('f-long_name').value.trim(),
    type:document.getElementById('f-type').value,
    publisher:document.getElementById('f-publisher').value.trim(),
    access_url:document.getElementById('f-access_url').value.trim(),
    open_access:document.getElementById('f-open_access').checked,
    notes:document.getElementById('f-notes').value.trim(),
    download_sources:sources,
    proceedings_years:[],
  };
}

async function doSave(){
  const body=getForm();
  if(!body.short_name){setStatus('short_name is required','err');return;}
  setStatus('Saving…','');
  try{
    const r=await fetch('/api/venues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){setStatus((d.detail||JSON.stringify(d)),'err');return;}
    setStatus('Saved: '+d.slug,'');
    clearForm();
    loadChips();
  }catch(e){setStatus('Request failed: '+e.message,'err');}
}

function clearForm(){
  ['f-short_name','f-long_name','f-publisher','f-access_url','f-notes'].forEach(id=>set(id,''));
  document.getElementById('f-type').value='';
  document.getElementById('f-open_access').checked=false;
  document.getElementById('sources-body').innerHTML='';
  setStatus('','');
}

function setStatus(msg,cls){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className=cls||'';
}

async function loadChips(){
  try{
    const r=await fetch('/api/venues');
    const list=await r.json();
    const cont=document.getElementById('chips');
    cont.innerHTML='';
    if(!list.length){document.getElementById('chips-section').style.display='none';return;}
    document.getElementById('chips-section').style.display='';
    list.forEach(v=>{
      const chip=document.createElement('div');
      chip.className='chip';
      chip.innerHTML=`<span>${v.short_name}</span>
        <a href="/api/venues/${v.slug}" target="_blank">view</a>
        <a href="/api/venues/${v.slug}" download="${v.slug}.json">JSON</a>`;
      cont.appendChild(chip);
    });
  }catch(e){}
}

loadChips();
</script>
</body>
</html>
