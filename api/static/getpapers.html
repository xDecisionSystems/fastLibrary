<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Papers — Paper Library</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;padding:24px}
  h1{font-size:1.35rem;margin-bottom:4px}
  .subtitle{font-size:.86rem;color:#666;margin-bottom:18px}
  nav{margin-bottom:16px;font-size:.875rem}
  nav a{color:#0066cc;text-decoration:none;margin-right:12px}
  nav a:hover{text-decoration:underline}
  .card{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .controls input{width:120px;padding:7px 10px;border:1px solid #ccc;border-radius:4px;font-size:.875rem}
  .btn{padding:7px 12px;border:none;border-radius:4px;cursor:pointer;font-size:.85rem}
  .btn-primary{background:#0066cc;color:#fff}
  .btn-primary:hover{background:#0052a3}
  .btn-secondary{background:#e0e0e0;color:#333}
  .btn-secondary:hover{background:#c8c8c8}
  table{width:100%;border-collapse:collapse;font-size:.875rem}
  th{text-align:left;padding:10px 12px;background:#f0f0f0;border-bottom:1px solid #ddd}
  td{padding:9px 12px;border-bottom:1px solid #eee}
  tr:last-child td{border-bottom:none}
  .status-ok{color:green;font-weight:600}
  .status-err{color:#b30000;font-weight:600}
  #empty{display:none;padding:16px 4px;color:#777;font-size:.9rem}
  #status{margin-top:12px;font-size:.86rem;min-height:20px}
  #status.err{color:#b30000}
  #status.ok{color:green}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.2);width:100%;max-width:860px;max-height:80vh;display:flex;flex-direction:column}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e0e0e0}
  .modal-header h2{font-size:1rem;font-weight:600;margin:0}
  .modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#555;line-height:1}
  .modal-body{overflow-y:auto;padding:14px 18px;flex:1}
  .modal-body table{width:100%;border-collapse:collapse;font-size:.8rem}
  .modal-body th{text-align:left;padding:8px 10px;background:#f0f0f0;border-bottom:1px solid #ddd;white-space:nowrap}
  .modal-body td{padding:7px 10px;border-bottom:1px solid #eee;vertical-align:top}
  .modal-body tr:last-child td{border-bottom:none}
  .modal-empty{color:#777;font-size:.9rem;padding:8px 0}
  #modal-status{margin-top:8px;font-size:.85rem;min-height:18px}
  #modal-status.err{color:#b30000}
  .btn-search{background:#6c3483;color:#fff}
  .btn-search:hover{background:#512e6d}
</style>
</head>
<body>
<nav>
  <a href="/venues">All</a>
  <a href="/conferences">Conferences</a>
  <a href="/journals">Journals</a>
</nav>

<h1 id="title">Get Papers</h1>
<p id="subtitle" class="subtitle">Download papers by conference year.</p>

<div class="card">
  <div class="controls">
    <input id="year-input" type="number" min="1900" step="1" placeholder="Year (e.g. 2025)">
    <button class="btn btn-secondary" onclick="addYear()">Add Year</button>
    <button class="btn btn-secondary" onclick="load()">Refresh</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Found</th>
        <th>Downloaded Papers</th>
        <th>Last Attempted</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty">No years yet. Add a year and click "Download".</div>
  <div id="status"></div>
</div>

<div id="search-modal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Search Results</h2>
      <button class="modal-close" onclick="closeSearchModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="modal-status"></div>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script>
const slug=location.pathname.split('/').filter(Boolean).pop();
let rows=[];

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}

function setStatus(msg,kind=''){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className=kind;
}

function formatDate(value){
  if(!value)return '—';
  const dt=new Date(value);
  if(Number.isNaN(dt.getTime()))return value;
  return dt.toLocaleString();
}

function render(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  rows.sort((a,b)=>b.year-a.year);
  document.getElementById('empty').style.display=rows.length?'none':'';
  rows.forEach((r)=>{
    const tr=document.createElement('tr');
    const statusClass=r.last_status==='success'?'status-ok':(r.last_status==='error'?'status-err':'');
    const statusLabel=r.last_status?r.last_status.toUpperCase():'—';
    const errorSuffix=r.last_error?`<div style="font-size:.74rem;color:#777">${esc(r.last_error)}</div>`:'';
    tr.id=`row-${r.year}`;
    tr.innerHTML=`
      <td class="mono">${r.year}</td>
      <td id="found-${r.year}">${Number.isFinite(r.found_papers)&&r.found_papers>0?r.found_papers:'—'}</td>
      <td>${Number.isFinite(r.downloaded_papers)?r.downloaded_papers:0}</td>
      <td>${esc(formatDate(r.last_attempted_at))}</td>
      <td><span class="${statusClass}">${statusLabel}</span>${errorSuffix}</td>
      <td style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-search" onclick="searchYear(${r.year})">Search</button>
        <button class="btn btn-primary" onclick="downloadYear(${r.year})">Download</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function upsertRow(year){
  const numericYear=Number(year);
  if(!Number.isInteger(numericYear)||numericYear<1900){
    setStatus('Please enter a valid year (1900+).','err');
    return;
  }
  const exists=rows.some(r=>r.year===numericYear);
  if(exists){
    setStatus(`Year ${numericYear} already exists.`,`err`);
    return;
  }
  rows.push({
    year:numericYear,
    downloaded_papers:0,
    last_attempted_at:'',
    last_status:'',
    last_error:'',
  });
  setStatus('', '');
  render();
}

function addYear(){
  const input=document.getElementById('year-input');
  upsertRow(input.value.trim());
  input.value='';
}

async function downloadYear(year){
  setStatus(`Downloading papers for ${year}…`,'');
  try{
    const r=await fetch(`/api/venues/${encodeURIComponent(slug)}/paper-downloads/${year}`,{method:'POST'});
    const d=await r.json();
    if(!r.ok){
      setStatus(d.detail||'Download failed.','err');
      await load();
      return;
    }
    setStatus(`Download complete for ${year}: ${d.downloaded_papers||0} papers.`, 'ok');
    await load();
  }catch(e){
    setStatus('Request failed: '+e.message,'err');
  }
}

async function load(){
  setStatus('Loading…','');
  try{
    const r=await fetch(`/api/venues/${encodeURIComponent(slug)}/paper-downloads`);
    const d=await r.json();
    if(!r.ok){
      setStatus(d.detail||'Failed to load conference paper status.','err');
      return;
    }
    document.getElementById('title').textContent=`Get Papers — ${d.short_name||slug}`;
    document.getElementById('subtitle').textContent=d.long_name||'Download papers by conference year.';
    rows=(d.years||[]).map((row)=>({
      year:Number(row.year),
      found_papers:Number(row.found_papers||0),
      downloaded_papers:Number(row.downloaded_papers||0),
      last_attempted_at:row.last_attempted_at||'',
      last_status:row.last_status||'',
      last_error:row.last_error||'',
    })).filter((row)=>Number.isInteger(row.year));
    setStatus('', '');
    render();
  }catch(e){
    setStatus('Failed to load: '+e.message,'err');
  }
}

function closeSearchModal(){
  document.getElementById('search-modal').classList.remove('open');
}

document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeSearchModal();});
document.getElementById('search-modal').addEventListener('click',(e)=>{if(e.target===e.currentTarget)closeSearchModal();});

async function searchYear(year){
  document.getElementById('modal-title').textContent=`Search Results — ${year}`;
  document.getElementById('modal-content').innerHTML='';
  document.getElementById('modal-status').textContent='Searching…';
  document.getElementById('modal-status').className='';
  document.getElementById('search-modal').classList.add('open');
  try{
    const r=await fetch(`/api/venues/${encodeURIComponent(slug)}/paper-search/${year}`);
    const d=await r.json();
    if(!r.ok){
      document.getElementById('modal-status').textContent=d.detail||'Search failed.';
      document.getElementById('modal-status').className='err';
      return;
    }
    const papers=d.papers||[];
    const total=d.total||papers.length;
    document.getElementById('modal-status').textContent=`${total} paper(s) found. Results cached locally.`;
    const foundCell=document.getElementById(`found-${year}`);
    if(foundCell)foundCell.textContent=total>0?total:'—';
    if(!papers.length){
      document.getElementById('modal-content').innerHTML='<p class="modal-empty">No papers returned by the searcher.</p>';
      return;
    }
    const rows=papers.map((p)=>{
      const doi=esc(p.doi||p.DOI||'');
      const title=esc(p.title||'Untitled');
      const authors=Array.isArray(p.authors)?esc(p.authors.slice(0,3).join(', ')+(p.authors.length>3?' et al.':'')):esc(p.authors||'');
      const yr=esc(p.publication_year||p.year||'');
      const src=esc(p.source||'');
      return `<tr><td class="mono" style="white-space:nowrap">${doi||'—'}</td><td>${title}</td><td>${authors}</td><td>${yr}</td><td>${src}</td></tr>`;
    }).join('');
    document.getElementById('modal-content').innerHTML=`
      <table>
        <thead><tr><th>DOI</th><th>Title</th><th>Authors</th><th>Year</th><th>Source</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }catch(e){
    document.getElementById('modal-status').textContent='Request failed: '+e.message;
    document.getElementById('modal-status').className='err';
  }
}

load();
</script>
</body>
</html>
