<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venues — Paper Library</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;padding:24px}
  h1{font-size:1.4rem;margin-bottom:6px}
  .subtitle{font-size:.85rem;color:#666;margin-bottom:20px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
  .toolbar input{flex:1;padding:7px 12px;border:1px solid #ccc;border-radius:4px;font-size:.875rem}
  .btn{padding:7px 14px;border:none;border-radius:4px;cursor:pointer;font-size:.875rem}
  .btn-primary{background:#0066cc;color:#fff}
  .btn-primary:hover{background:#0052a3}
  .btn-secondary{background:#e0e0e0;color:#333}
  .btn-secondary:hover{background:#c8c8c8}
  .btn-danger{background:#cc2222;color:#fff}
  .btn-danger:hover{background:#a01a1a}
  .card{background:#fff;border-radius:8px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.875rem}
  th{text-align:left;padding:10px 14px;background:#f0f0f0;border-bottom:1px solid #ddd;white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid #eee;vertical-align:top}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable .sort-ind{font-size:.75rem;color:#888;margin-left:6px}
  th.sortable.active .sort-ind{color:#0066cc}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafafa}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;background:#e8f0fe;color:#0052a3}
  .badge.journal{background:#fce8e8;color:#a01a1a}
  .oa{color:green;font-size:.8rem}
  .actions{display:flex;gap:6px}
  #empty{display:none;padding:32px;text-align:center;color:#888;font-size:.9rem}
  nav{margin-bottom:16px;font-size:.875rem}
  nav a{color:#0066cc;text-decoration:none;margin-right:12px}
  nav a:hover{text-decoration:underline}
  nav a.active{font-weight:600;color:#333}
  .tag-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag-chip{padding:3px 12px;border-radius:12px;font-size:.78rem;cursor:pointer;border:1px solid #bbb;background:#fff;color:#444}
  .tag-chip.active{background:#0066cc;color:#fff;border-color:#0066cc}
  .tag-chip-row{display:flex;flex-wrap:wrap;gap:4px;font-size:.75rem}
  .tag-badge{background:#e8f0fe;color:#0052a3;border-radius:8px;padding:1px 7px}
</style>
</head>
<body>
<nav>
  <a href="/venues" class="active">All</a>
  <a href="/conferences">Conferences</a>
  <a href="/journals">Journals</a>
  <a href="/addconf">+ Add Conference</a>
  <a href="/addjournal">+ Add Journal</a>
  <a href="/tags">Tags</a>
  <a href="/strategies">Strategies</a>
</nav>
<h1>Venues</h1>
<p class="subtitle">All conferences and journals in the library.</p>

<div class="toolbar">
  <input id="search" type="text" placeholder="Filter by name…" oninput="renderTable()">
</div>
<div class="tag-filters" id="tag-filters"></div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th class="sortable" data-sort="short_name">Short Name <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="long_name">Long Name <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="type">Type <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="publisher">Publisher <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="due_date_month">Submission Deadline <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="website_url">Links <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="tags">Tags <span class="sort-ind"></span></th>
        <th class="sortable" data-sort="open_access">Open Access <span class="sort-ind"></span></th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty">No venues found.</div>
</div>

<script>
let venues=[];
let activeTag=null;
let sortKey='short_name';
let sortDir='asc';
const MONTH_ORDER={
  January:1,February:2,March:3,April:4,May:5,June:6,
  July:7,August:8,September:9,October:10,November:11,December:12
};

async function load(){
  try{
    const [venuesRes,tagsRes]=await Promise.all([fetch('/api/venues'),fetch('/api/venues/tags')]);
    venues=await venuesRes.json();
    const tags=await tagsRes.json();
    renderTagFilters(tags);
    renderTable();
  }catch(e){document.getElementById('empty').textContent='Failed to load venues.';document.getElementById('empty').style.display='';}
}

function renderTagFilters(tags){
  const bar=document.getElementById('tag-filters');
  bar.innerHTML='';
  if(!tags.length)return;
  tags.forEach(t=>{
    const chip=document.createElement('button');
    chip.className='tag-chip'+(activeTag===t?' active':'');
    chip.textContent=t;
    chip.onclick=()=>{activeTag=(activeTag===t?null:t);renderTagFilters(tags);renderTable();};
    bar.appendChild(chip);
  });
}

function renderTable(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const rows=venues.filter(v=>{
    if(q&&!(v.short_name+v.long_name).toLowerCase().includes(q))return false;
    if(activeTag&&!(v.tags||[]).includes(activeTag))return false;
    return true;
  });
  rows.sort((a,b)=>{
    const cmp=compareSortValues(a,b,sortKey);
    return sortDir==='asc'?cmp:-cmp;
  });
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  document.getElementById('empty').style.display=rows.length?'none':'';
  rows.forEach(v=>{
    const tagBadges=(v.tags||[]).map(t=>`<span class="tag-badge">${esc(t)}</span>`).join(' ');
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><strong>${esc(v.short_name)}</strong></td>
      <td>${esc(v.long_name)}</td>
      <td><span class="badge ${v.type==='journal'?'journal':''}">${esc(v.type||'—')}</span></td>
      <td>${esc(v.publisher||'—')}</td>
      <td>${esc(v.due_date_month||'—')}</td>
      <td>${v.website_url?`<a href="${esc(v.website_url)}" target="_blank">Website</a>`:'—'}${v.proceedings_url?` · <a href="${esc(v.proceedings_url)}" target="_blank">Proceedings</a>`:''}</td>
      <td><div class="tag-chip-row">${tagBadges||'—'}</div></td>
      <td>${v.open_access?'<span class="oa">✓ Yes</span>':'No'}</td>
      <td class="actions">
        ${v.type==='conference'
          ?`<a href="/getpapers/${v.slug}" class="btn btn-secondary" style="text-decoration:none;padding:4px 10px;font-size:.78rem">Get Papers</a>`
          :''}
        <a href="/venues/${v.slug}" class="btn btn-primary" style="text-decoration:none;padding:4px 10px;font-size:.78rem">View</a>
        <button class="btn btn-danger" style="padding:4px 10px;font-size:.78rem" onclick="doDelete('${v.slug}')">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}

function getSortValue(v,key){
  if(key==='open_access')return v.open_access?1:0;
  if(key==='tags')return (v.tags||[]).join(', ');
  if(key==='due_date_month')return MONTH_ORDER[v.due_date_month]||99;
  if(key==='website_url')return v.website_url||v.proceedings_url||'';
  return String(v[key]||'');
}

function compareSortValues(a,b,key){
  const va=getSortValue(a,key);
  const vb=getSortValue(b,key);
  if(typeof va==='number'&&typeof vb==='number')return va-vb;
  return String(va).localeCompare(String(vb),undefined,{sensitivity:'base'});
}

function setSort(key){
  if(sortKey===key)sortDir=sortDir==='asc'?'desc':'asc';
  else{sortKey=key;sortDir='asc';}
  updateSortIndicators();
  renderTable();
}

function updateSortIndicators(){
  document.querySelectorAll('th.sortable').forEach(th=>{
    const key=th.dataset.sort;
    const ind=th.querySelector('.sort-ind');
    const active=key===sortKey;
    th.classList.toggle('active',active);
    th.setAttribute('aria-sort',active?(sortDir==='asc'?'ascending':'descending'):'none');
    ind.textContent=active?(sortDir==='asc'?'▲':'▼'):'';
  });
}

function initSortableHeaders(){
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.onclick=()=>setSort(th.dataset.sort);
  });
  updateSortIndicators();
}

async function doDelete(slug){
  if(!confirm('Delete venue "'+slug+'"?'))return;
  await fetch('/api/venues/'+slug,{method:'DELETE'});
  await load();
}

initSortableHeaders();
load();
</script>
</body>
</html>
